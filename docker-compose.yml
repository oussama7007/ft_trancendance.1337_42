services:
  frontend:
    image: frontend
    build:
      context: ./frontend
    container_name: frontend-container
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # depends_on:
    #   - backend
  database:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: backend
    command: sh -c "npm run migration:run && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT : ${DB_PORT}
      DB_USERNAME : ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
