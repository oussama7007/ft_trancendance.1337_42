services:
  database:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: backend
    # Run migrations separately when the database schema changes.
    # Starting the server should stay fast and should not rerun migrations every time.
    command: npm run start:dev
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    # Values come from backend/.env. PostgreSQL is reached by service name
    # inside Docker, not by localhost.
    environment:
      DB_HOST: database
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The frontend must wait until the session endpoint itself exists.
      # Both 200 (signed in) and 401 (signed out) mean the backend is ready.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/auth/me').then((response) => process.exit(response.status === 200 || response.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  frontend:
    build:
      context: ./frontend
    container_name: frontend-container
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
       backend:
        condition: service_healthy

volumes:
  postgres_data: