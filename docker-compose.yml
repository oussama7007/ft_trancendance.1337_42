services:
  database:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: backend
    # Run migrations automatically on startup, then start the development server
    command: bash start.sh
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    # Values come from backend/.env. PostgreSQL is reached by service name
    # inside Docker, not by localhost.
    environment:
      DB_HOST: database
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # The frontend must wait until the session endpoint itself exists.
      # Both 200 (signed in) and 401 (signed out) mean the backend is ready.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/auth/me').then((response) => process.exit(response.status === 200 || response.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  frontend:
    build:
      context: ./frontend
    container_name: frontend-container
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
       backend:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: database:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USERNAME}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.13.1
    container_name: node-exporter

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - postgres-exporter
      - node-exporter

  grafana:
    image: grafana/grafana:13.3.1
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
