global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ['backend:3000']

  - job_name: database
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
